name: Console source validation

on:
  push:
    paths:
      - 'index.html'
      - 'study-console-adapter.css'
      - '.github/workflows/flatten-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the maintained entry page
        run: |
          test -f index.html
          test -f study-console-adapter.css
          test -f .nojekyll
          python - <<'PYCODE'
          from pathlib import Path
          html = Path('index.html').read_text()
          for asset in ('theme-init.js', 'study-system.css', 'study-system.js'):
              assert 'shared/v2/' + asset in html, asset
          PYCODE
