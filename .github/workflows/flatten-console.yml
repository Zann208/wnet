name: Flatten WNET console

on:
  push:
    paths:
      - '.github/workflows/flatten-console.yml'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained entry page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('legacy.html').read_text(encoding='utf-8')
          scripts = '''
          <script src="./midterm-q1.js?v=20260817"></script>
          <script src="./midterm-q2.js?v=20260817"></script>
          <script src="./midterm-q3.js?v=20260817"></script>
          <script src="./midterm-q4.js?v=20260817"></script>
          <script src="./midterm-q5.js?v=20260817"></script>
          <script src="./midterm-ui.js?v=20260818c"></script>
          <script src="./redo-questions.js?v=20260825"></script>
          <script src="./answer-guide.js?v=20260821-allchoices"></script>
          <script src="./terms-upgrade.js?v=20260821a"></script>
          <script src="./terms-cleanup.js?v=20260821b"></script>
          <script src="./terms-extra.js?v=20260822a"></script>
          <script src="./navigation-upgrade.js?v=20260821-instant"></script>
          <script src="./chapter-upgrade.js?v=20260821a"></script>
          <script src="./chapter-layout.js?v=20260821-strongsplit"></script>
          <script src="./question-study.js?v=20260822-exact"></script>
          <script src="./course-switcher-hackathon.js?v=20260825"></script>
          <script src="./wifi-logo.js?v=20260817"></script>
          '''
          html = html.replace('</body>', scripts + '\n</body>')
          Path('index.html').write_text(html, encoding='utf-8')
          PY
      - name: Add static hosting marker
        run: touch .nojekyll
      - name: Commit stabilized entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git commit -m "Stabilize WNET self-contained entry" || exit 0
          git push
