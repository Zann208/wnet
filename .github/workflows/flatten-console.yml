name: Console source validation

on:
  push:
    paths:
      - 'index.html'
      - '*.js'
      - '.github/workflows/flatten-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the maintained entry page
        run: |
          test -f index.html
          test -f .nojekyll || true
          for f in *.js; do node --check "$f"; done
      - name: Verify Study Console v3 wiring and v2 rollback page
        run: |
          test -f index.v2.html
          grep -q 'study/shared/v3/boot.js' index.html
          grep -q 'data-v2="index.v2.html"' index.html
          grep -q 'StudyConsole' index.html
          if grep -q 'shared/v2/' index.html; then echo "index.html still loads v2"; exit 1; fi
